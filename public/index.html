<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCMCP</title><link rel="stylesheet" href="style.css"></head><body><main><h1>PCMCP</h1><p class="tag">Start on one computer. Continue on another. Send it back.</p><section class="device"><label>THIS COMPUTER</label><select id="platform"><option value="mac">Mac</option><option value="windows">Windows</option></select></section><section id="card" class="card"><strong id="stateText">PINK</strong><span>same task, same state</span></section><div class="buttons"><button data-color="pink">Pink</button><button data-color="blue">Blue</button><button id="send">Send state</button></div><pre id="code"></pre><p id="status">Ready</p></main><script src="app.js"></script></body></html>
